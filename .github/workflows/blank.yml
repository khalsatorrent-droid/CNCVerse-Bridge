name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # The repo does not ship key/release.jks. If a KEYSTORE_BASE64 secret exists it is used
      # (stable signature, so updates install over old builds); otherwise a keystore is generated.
      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p key
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > key/release.jks
          else
            keytool -genkeypair -v -keystore key/release.jks -alias release \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass android -keypass android -dname "CN=CNCVerse Bridge"
          fi

      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew :androidApp:assembleRelease --no-daemon

      - name: Rename APK
        run: |
          mkdir -p out
          cp androidApp/build/outputs/apk/release/*.apk "out/CNCverse-Bridge-Mod.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: CNCverse-Bridge-Mod
          path: out/CNCverse-Bridge-Mod.apk
