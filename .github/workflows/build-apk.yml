name: Build APK

# Builds an installable Android APK on every push to main (and by hand from the Actions tab).
# Download it from the run's "Artifacts" section, or from the "latest" release.
#
# Signing: if the repository secrets ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD /
# ANDROID_KEY_ALIAS / ANDROID_KEY_PASSWORD exist they are used. Otherwise the APK is signed with the
# sideload key in ci/ so every build installs over the previous one. That key is public in the repo:
# fine for personal sideloading, add your own secrets if you share the APK.

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "Using the keystore from repository secrets"
          else
            base64 -d ci/sideload.jks.b64 > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_PASSWORD=android" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_ALIAS=release" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_PASSWORD=android" >> "$GITHUB_ENV"
            echo "Using the sideload key from ci/"
          fi
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - name: Build release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD || env.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || env.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD || env.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :androidApp:assembleRelease
          mkdir -p out
          apk=$(find androidApp/build/outputs/apk/release -name '*.apk' | head -1)
          cp "$apk" "out/CNCVerse-Bridge.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: CNCVerse-Bridge-apk
          path: out/CNCVerse-Bridge.apk
      - name: Publish to the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          gh release create latest out/CNCVerse-Bridge.apk --title "Latest build" \
            --notes "Automatic build of ${GITHUB_SHA::7}" --target "$GITHUB_SHA" || echo "::warning::release upload skipped"
