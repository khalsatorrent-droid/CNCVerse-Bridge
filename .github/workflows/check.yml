name: Check

# Compiles the Android and desktop apps and runs the unit tests. Runs on pull requests and by hand
# (Actions tab -> Check -> Run workflow, pick a branch). Nothing is published.

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests, desktop compile, Android compile
        run: |
          chmod +x gradlew
          set -o pipefail
          trap 'grep -E "^w: .*(nreachable|always .?(true|false)|is never used|never be null|Unchecked cast|shadowed|deprecated.*removed)" "$RUNNER_TEMP/build.log" | grep -v "/build/" | sort -u | head -45 | sed -E "s#^w: (file://)?([^:]+):([0-9]+):([0-9]+) (.*)#::warning file=\\2,line=\\3::\\5#"' EXIT
          ./gradlew --no-daemon :shared:desktopTest :desktopApp:compileKotlinDesktop :androidApp:assembleDebug 2>&1 | tee "$RUNNER_TEMP/build.log" || {
            grep -E "^e: " "$RUNNER_TEMP/build.log" | head -40 | sed -E 's#^e: (file://)?([^:]+):([0-9]+):([0-9]+) (.*)#::error file=\2,line=\3,col=\4::\5#' || true
            grep -E "FAILED$|Test.*FAILED|AssertionError|expected:" "$RUNNER_TEMP/build.log" | head -20 | sed 's/^/::error::/' || true
            exit 1
          }
